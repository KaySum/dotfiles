# Visual theming for tmux: palette, styles and status-bar formats.
# Sourced from tmux.conf - keep behaviour there, appearance here.

# ── Colors ─────────────────────────────────
# lualine-style sections: A = session, B = current window, C = the bar itself
set -g @a_fg "#1a1b26"
set -g @a_bg "#7aa2f7"
set -g @b_fg "#a9b1d6"
set -g @b_bg "#3b4261"
set -g @c_fg "#787c99"
set -g @c_bg "#1f2335"
set -g @prefix_bg "#e0af68"
set -g @mark "#e0af68"   # marked
set -g @warn "#f7768e"   # bell / activity

# ── Status Bar ───────────────────────────────
# set -g status-position bottom
# Removing a line never unsets an option in a running server, so reset
# the per-range styles explicitly and let the formats below do the work.
set -g status-left-style default
set -g status-right-style default
set -g window-status-style default
set -g window-status-current-style default

set -g status-style "fg=#{@c_fg},bg=#{@c_bg}"

set -g status-left "#[fg=#{@a_fg},bg=#{?client_prefix,#{@prefix_bg},#{@a_bg}}] #S #[fg=#{@c_fg},bg=#{@c_bg}]"
set -g status-left-length 30

set -g status-right "#[fg=#{@c_fg},bg=#{@c_bg}] %Y-%m-%d "
set -g status-right-length 40

set -g window-status-separator ""  # gap comes from the padding in the formats below
# Window state lives in the index, not in trailing letters:
#   marked -> amber pill   bell/activity -> red pill
#   last window -> underlined index   zoomed -> italic name
# Both formats emit the same cells so switching windows never shifts the bar.
set -g window-status-format "#[fg=#{?#{||:#{||:#{window_bell_flag},#{window_activity_flag}},#{window_marked_flag}},#{@a_fg},#{@b_fg}},bg=#{?window_marked_flag,#{@mark},#{?#{||:#{window_bell_flag},#{window_activity_flag}},#{@warn},#{@b_bg}}}]#[#{?window_last_flag,underscore,nounderscore}] #I #[nounderscore,fg=#{@c_fg},bg=#{@c_bg}]#[#{?window_zoomed_flag,italics,noitalics}] #W #[noitalics]"
set -g window-status-current-format "#[fg=#{@a_fg},bg=#{?window_marked_flag,#{@mark},#{@a_bg}}]#[#{?window_last_flag,underscore,nounderscore}] #I #[nounderscore,fg=#{@b_fg},bg=#{@b_bg}]#[#{?window_zoomed_flag,italics,noitalics}] #W #[noitalics]"
