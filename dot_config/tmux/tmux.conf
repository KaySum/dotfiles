# Generated by tmux.app Config Generator
# https://tmux.app/#config-generator

# ── Prefix Key ──────────────────────────
# Default prefix: Ctrl+b (no change needed)

# ── General Settings ─────────────────────
set -g mouse on
set-window-option -g mode-keys vi
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -s extended-keys on
set -as extended-keys-format csi-u

set -g automatic-rename on
set -g automatic-rename-format "#{pane_current_command} - #{b:pane_current_path}"

# ── Status Bar ────────────────────────────
# set -g status-position bottom
set -g status-interval 5
set -g status-left " #S "
set -g status-right " %Y-%m-%d "

set -g status-style "fg=black,bg=#{?client_prefix,yellow,red}"

set -g window-status-format "#I:[#W]#{?window_flags,#{window_flags}, }"
set -g window-status-current-format "#I:[#W]#{?window_flags,#{window_flags}, }"

# ── Terminal Colors ──────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

