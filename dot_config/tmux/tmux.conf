# Generated by tmux.app Config Generator
# https://tmux.app/#config-generator

# ── Prefix Key ──────────────────────────
# Default prefix: Ctrl+b (no change needed)

# ── General Settings ─────────────────────
set -g mouse on
set-window-option -g mode-keys vi
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -s escape-time 0   # default 500ms delays ESC in vim/nvim
set -g focus-events on  # lets nvim see focus changes for autoread
set -g status-interval 5

set -s extended-keys on
set -as extended-keys-format csi-u

set -g automatic-rename on
set -g automatic-rename-format "#{pane_current_command} - #{b:pane_current_path}"

# ── Key Bindings ─────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"
bind c new-window -a -c "#{pane_current_path}"

# Switch windows (wraps around); prefix+number jumps straight to one
bind-key -n M-h previous-window
bind-key -n M-l next-window

# Move current window to the left
bind-key -r < swap-window -t -1\; select-window -t -1
# Move current window to the right
bind-key -r > swap-window -t +1\; select-window -t +1

# ── Theme ────────────────────────────────
source-file ~/.config/tmux/theme.conf

# ── Terminal Colors ──────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# ── TPM Plugin Manager ───────────────────
set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-strategy-nvim 'session'
run '$HOMEBREW_PREFIX/opt/tpm/share/tpm/tpm'
