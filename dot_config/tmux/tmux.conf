# Generated by tmux.app Config Generator
# https://tmux.app/#config-generator

# ── Prefix Key ──────────────────────────
# Default prefix: Ctrl+b (no change needed)

# ── General Settings ─────────────────────
set -g mouse on
set-window-option -g mode-keys vi
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -s escape-time 10   # default 500ms delays ESC in vim/nvim
set -g focus-events on  # lets nvim see focus changes for autoread

set -s extended-keys on
set -as extended-keys-format csi-u

set -g automatic-rename on
set -g automatic-rename-format "#{pane_current_command} - #{b:pane_current_path}"

# ── Key Bindings ─────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"
bind c new-window -a -c "#{pane_current_path}"

# Switch windows (wraps around); prefix+number jumps straight to one
bind-key -n C-S-Left previous-window
bind-key -n C-S-Right next-window

# Move current window to the left
bind-key -r < swap-window -t -1\; select-window -t -1
# Move current window to the right
bind-key -r > swap-window -t +1\; select-window -t +1

# ── Colors ───────────────────────────────
set -g @bar_fg "black"
set -g @bar_bg "white"
set -g @prefix_fg "black"
set -g @prefix_bg "red"

# ── Status Bar ────────────────────────────
# set -g status-position bottom
set -g status-interval 5
set -g status-left " #S "
set -g status-left-length 30
set -g status-right " %Y-%m-%d "

# Prefix indicator: bar changes color when prefix is pending 
set -g status-style "fg=#{?client_prefix,#{@prefix_fg},#{@bar_fg}},bg=#{?client_prefix,#{@prefix_bg},#{@bar_bg}}"
set -g window-status-current-style "fg=#{?client_prefix,#{@prefix_fg},#{@bar_bg}},bg=#{?client_prefix,#{@prefix_bg},#{@bar_fg}}"

set -g window-status-separator ""  # gap comes from the padding in the formats below
set -g window-status-format " #I:[#W]#{window_flags} "
set -g window-status-current-format " #I:[#W]#{window_flags} "

# ── Terminal Colors ──────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

